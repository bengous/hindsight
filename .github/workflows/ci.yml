name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: ./node_modules/.bin/claude plugin test .
      - run: ./node_modules/.bin/claude plugin validate .
      - run: bun docs/plan/check.ts

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # land and release require this job green on every SHA, so a change that leaves .github alone skips the audit, not the job.
      # A task branch compares its whole history to dev, so a later push cannot turn green a branch whose earlier push failed the audit.
      - name: Find whether the change touches .github
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/dev | refs/heads/main) base=$BEFORE ;;
            *) base=$(git merge-base origin/dev HEAD || true) ;;
          esac
          if [ "$EVENT" = push ] && git cat-file -e "$base^{commit}" 2>/dev/null && git diff --quiet "$base" HEAD -- .github; then
            echo "audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "audit=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.audit == 'true'
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          persona: pedantic
          advanced-security: false
