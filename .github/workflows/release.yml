name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, vX.Y.Z
        required: true
      notes:
        description: Release notes, Markdown
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move main, create the tag and its GitHub Release
    steps:
      - name: Fast-forward main to dev's green head, then tag and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must read vX.Y.Z, not '$TAG'."
            exit 1
          fi
          for check in checks zizmor; do
            conclusion=$(gh api "repos/$REPO/commits/$SHA/check-runs" -f check_name="$check" -X GET --jq '.check_runs[0].conclusion // "missing"')
            if [ "$conclusion" != success ]; then
              echo "::error::Check $check on $SHA is $conclusion: main only moves to a green SHA."
              exit 1
            fi
          done
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != ahead ]; then
            echo "::error::dev at $SHA is $status relative to main: main only moves forward."
            exit 1
          fi

          gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$SHA" -F force=false --silent
          echo "main is at $SHA."
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TAG" --notes "$NOTES"
